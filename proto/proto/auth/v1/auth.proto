syntax = "proto3";

package berusmenu.auth.v1;

import "common/v1/common.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/tmcrypted/berusmenu/proto/gen/go/auth/v1;authv1";

message User {
  int64 id = 1;
  string email = 2;
  optional google.protobuf.Timestamp email_verified_at = 3;
  berusmenu.common.v1.UserRole role = 4;
  string full_name = 5;
  optional string phone = 6;
  optional string avatar_url = 7;
  google.protobuf.Timestamp created_at = 8;
  google.protobuf.Timestamp updated_at = 9;
}

message RegisterRequest {
  string email = 1;
  string password = 2;
  string full_name = 3;
  berusmenu.common.v1.UserRole role = 4;
  optional string phone = 5;
}

message LoginRequest {
  string email = 1;
  string password = 2;
}

message RefreshRequest {
  string refresh_token = 1;
}

message AuthTokens {
  string access_token = 1;
  string refresh_token = 2;
  google.protobuf.Timestamp access_expires_at = 3;
}

message AuthPayload {
  AuthTokens tokens = 1;
  User user = 2;
}

message RegisterResponse {
  AuthPayload auth = 1;
}

message LoginResponse {
  AuthPayload auth = 1;
}

message RefreshResponse {
  AuthPayload auth = 1;
}

message ValidateTokenRequest {
  string access_token = 1;
}

message ValidateTokenResponse {
  bool valid = 1;
  int64 user_id = 2;
  berusmenu.common.v1.UserRole role = 3;
  string email = 4;
  bool email_verified = 5;
}

message GetUserRequest {
  int64 user_id = 1;
}

message GetUserResponse {
  User user = 1;
}

message UpdateProfileRequest {
  optional string full_name = 1;
  optional string phone = 2;
  optional string avatar_url = 3;
}

message UpdateProfileResponse {
  User user = 1;
}

message LogoutRequest {
  string refresh_token = 1;
}

message LogoutResponse {}

message ResendVerificationCodeRequest {}

message ResendVerificationCodeResponse {
  google.protobuf.Timestamp code_expires_at = 1;
  google.protobuf.Timestamp resend_available_at = 2;
}

message VerifyEmailRequest {
  string code = 1;
}

message VerifyEmailResponse {
  User user = 1;
}

message BlockUserRequest {
  int64 user_id = 1;
  optional string reason = 2;
  google.protobuf.Timestamp blocked_until = 3;
}

message BlockUserResponse {
  User user = 1;
}

service AuthService {
  rpc Register(RegisterRequest) returns (RegisterResponse);
  rpc Login(LoginRequest) returns (LoginResponse);
  rpc Refresh(RefreshRequest) returns (RefreshResponse);
  rpc Logout(LogoutRequest) returns (LogoutResponse);
  rpc ValidateToken(ValidateTokenRequest) returns (ValidateTokenResponse);
  rpc GetUser(GetUserRequest) returns (GetUserResponse);
  rpc UpdateProfile(UpdateProfileRequest) returns (UpdateProfileResponse);
  rpc ResendVerificationCode(ResendVerificationCodeRequest) returns (ResendVerificationCodeResponse);
  rpc VerifyEmail(VerifyEmailRequest) returns (VerifyEmailResponse);
  rpc BlockUser(BlockUserRequest) returns (BlockUserResponse);
}
