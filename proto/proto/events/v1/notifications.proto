syntax = "proto3";

package berusmenu.events.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/tmcrypted/berusmenu/proto/gen/go/events/v1;eventsv1";

message EmailVerificationRequested {
  int64 user_id = 1;
  string email = 2;
  string code = 3;
  google.protobuf.Timestamp occurred_at = 4;
}

message ResponseCreated {
  int64 response_id = 1;
  int64 vacancy_id = 2;
  int64 owner_user_id = 3;
  string owner_email = 4;
  int64 worker_user_id = 5;
  string vacancy_title = 6;
  string shift_date = 7;
  int64 pay_amount = 8;
  google.protobuf.Timestamp occurred_at = 9;
}
