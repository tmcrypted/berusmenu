syntax = "proto3";

package berusmenu.common.v1;

option go_package = "gitlab.com/berusmenu/proto/gen/go/common/v1;commonv1";

enum UserRole {
  USER_ROLE_UNSPECIFIED = 0;
  USER_ROLE_OWNER = 1;
  USER_ROLE_WORKER = 2;
  USER_ROLE_MODERATOR = 3;
}

enum PvzStatus {
  PVZ_STATUS_UNSPECIFIED = 0;
  PVZ_STATUS_PENDING = 1;
  PVZ_STATUS_APPROVED = 2;
  PVZ_STATUS_REJECTED = 3;
  PVZ_STATUS_BLOCKED = 4;
}

enum PvzModerationAction {
  PVZ_MODERATION_ACTION_UNSPECIFIED = 0;
  PVZ_MODERATION_ACTION_SUBMITTED = 1;
  PVZ_MODERATION_ACTION_APPROVED = 2;
  PVZ_MODERATION_ACTION_REJECTED = 3;
  PVZ_MODERATION_ACTION_BLOCKED = 4;
}

enum VacancyStatus {
  VACANCY_STATUS_UNSPECIFIED = 0;
  VACANCY_STATUS_PUBLISHED = 1;
  VACANCY_STATUS_ASSIGNED = 2;
  VACANCY_STATUS_COMPLETED = 3;
  VACANCY_STATUS_CANCELLED = 4;
}

enum ResponseStatus {
  RESPONSE_STATUS_UNSPECIFIED = 0;
  RESPONSE_STATUS_PENDING = 1;
  RESPONSE_STATUS_ACCEPTED = 2;
  RESPONSE_STATUS_REJECTED = 3;
  RESPONSE_STATUS_WITHDRAWN = 4;
}

enum AssignmentStatus {
  ASSIGNMENT_STATUS_UNSPECIFIED = 0;
  ASSIGNMENT_STATUS_ACTIVE = 1;
  ASSIGNMENT_STATUS_COMPLETED = 2;
  ASSIGNMENT_STATUS_CANCELLED = 3;
}

enum ReviewTargetRole {
  REVIEW_TARGET_ROLE_UNSPECIFIED = 0;
  REVIEW_TARGET_ROLE_OWNER = 1;
  REVIEW_TARGET_ROLE_WORKER = 2;
}
