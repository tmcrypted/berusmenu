syntax = "proto3";

package berusmenu.matching.v1;

import "common/v1/common.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/tmcrypted/berusmenu/proto/gen/go/matching/v1;matchingv1";

message Vacancy {
  int64 id = 1;
  int64 owner_id = 2;
  int64 pvz_id = 3;
  berusmenu.common.v1.VacancyStatus status = 4;
  optional string title = 5;
  optional string description = 6;
  google.protobuf.Timestamp shift_start_at = 7;
  google.protobuf.Timestamp shift_end_at = 8;
  string pvz_name_snapshot = 9;
  int64 pay_amount = 10;
  int32 slots_total = 11;
  google.protobuf.Timestamp created_at = 12;
  google.protobuf.Timestamp updated_at = 13;
  string pvz_address_snapshot = 14;
}

message Response {
  int64 id = 1;
  int64 vacancy_id = 2;
  int64 worker_id = 3;
  berusmenu.common.v1.ResponseStatus status = 4;
  optional string message = 5;
  google.protobuf.Timestamp created_at = 6;
  google.protobuf.Timestamp updated_at = 7;
}

message Assignment {
  int64 id = 1;
  int64 vacancy_id = 2;
  int64 response_id = 3;
  int64 owner_id = 4;
  int64 worker_id = 5;
  berusmenu.common.v1.AssignmentStatus status = 6;
  google.protobuf.Timestamp accepted_at = 7;
  string pvz_name_snapshot = 8;
  string pvz_address_snapshot = 9;
  google.protobuf.Timestamp shift_start_at_snapshot = 10;
  int64 pay_amount_snapshot = 11;
  google.protobuf.Timestamp shift_end_at_snapshot = 12;
  string owner_name_snapshot = 14;
  string worker_name_snapshot = 15;
  optional google.protobuf.Timestamp completed_at = 16;
  optional google.protobuf.Timestamp cancelled_at = 17;
  optional int64 cancelled_by_user_id = 18;
  optional string cancel_reason = 19;
  google.protobuf.Timestamp updated_at = 20;
  google.protobuf.Timestamp created_at = 21;
}

message Review {
  int64 id = 1;
  int64 assignment_id = 2;
  int64 author_user_id = 3;
  int64 target_user_id = 4;
  berusmenu.common.v1.ReviewTargetRole target_role = 5;
  int32 rating = 6;
  optional string body = 7;
  google.protobuf.Timestamp created_at = 8;
  google.protobuf.Timestamp updated_at = 9;
}

message ReviewReply {
  int64 id = 1;
  int64 review_id = 2;
  int64 author_user_id = 3;
  int64 target_user_id = 4;
  string body = 5;
  google.protobuf.Timestamp created_at = 6;
  google.protobuf.Timestamp updated_at = 7;
}

message UserRating {
  int64 user_id = 1;
  double avg_rating = 2;
  int64 reviews_count = 3;
  google.protobuf.Timestamp updated_at = 4;
}

message CreateVacancyRequest {
  int64 pvz_id = 1;
  optional string title = 2;
  optional string description = 3;
  google.protobuf.Timestamp shift_start_at = 4;
  google.protobuf.Timestamp shift_end_at = 5;
  int64 pay_amount = 7;
  int32 slots_total = 8;
}

message CreateVacancyResponse {
  Vacancy vacancy = 1;
}

message GetVacancyRequest {
  int64 id = 1;
}

message GetVacancyResponse {
  Vacancy vacancy = 1;
}

message ListVacanciesRequest {
  optional int64 pvz_id = 1;
  optional google.protobuf.Timestamp shift_start_from = 2;
  optional google.protobuf.Timestamp shift_start_to = 3;
  optional berusmenu.common.v1.VacancyStatus status = 4;
  int32 page_size = 5;
  optional string page_token = 6;
}

message ListVacanciesResponse {
  repeated Vacancy items = 1;
  optional string next_page_token = 2;
}

message ListOwnerVacanciesRequest {
  optional berusmenu.common.v1.VacancyStatus status = 1;
  int32 page_size = 2;
  optional string page_token = 3;
}

message ListOwnerVacanciesResponse {
  repeated Vacancy items = 1;
  optional string next_page_token = 2;
}

message CreateResponseRequest {
  int64 vacancy_id = 1;
  optional string message = 2;
}

message CreateResponseResponse {
  Response response = 1;
}

message WithdrawResponseRequest {
  int64 response_id = 1;
}

message WithdrawResponseResponse {
  Response response = 1;
}

message ListResponsesForVacancyRequest {
  int64 vacancy_id = 1;
  int32 page_size = 2;
  optional string page_token = 3;
}

message ListResponsesForVacancyResponse {
  repeated Response items = 1;
  optional string next_page_token = 2;
}

message ListMyResponsesRequest {
  int32 page_size = 1;
  optional string page_token = 2;
}

message ListMyResponsesResponse {
  repeated Response items = 1;
  optional string next_page_token = 2;
}

message AcceptResponseRequest {
  int64 response_id = 1;
  optional string admin_reason = 2;
}

message AcceptResponseResponse {
  Assignment assignment = 1;
}

message CancelAssignmentRequest {
  int64 assignment_id = 1;
  optional string cancel_reason = 2;
  optional string admin_reason = 3;
}

message CancelAssignmentResponse {
  Assignment assignment = 1;
}

message CompleteAssignmentRequest {
  int64 assignment_id = 1;
  optional string admin_reason = 2;
}

message CompleteAssignmentResponse {
  Assignment assignment = 1;
}

message GetAssignmentRequest {
  int64 id = 1;
}

message GetAssignmentResponse {
  Assignment assignment = 1;
}

message ListMyAssignmentsRequest {
  int32 page_size = 1;
  optional string page_token = 2;
}

message ListMyAssignmentsResponse {
  repeated Assignment items = 1;
  optional string next_page_token = 2;
}

message GetAssignmentForVacancyRequest {
  int64 vacancy_id = 1;
}

message GetAssignmentForVacancyResponse {
  Assignment assignment = 1;
}

message CreateReviewRequest {
  int64 assignment_id = 1;
  int32 rating = 2;
  optional string body = 3;
}

message CreateReviewResponse {
  Review review = 1;
}

message UpdateReviewRequest {
  int64 review_id = 1;
  optional int32 rating = 2;
  optional string body = 3;
}

message UpdateReviewResponse {
  Review review = 1;
}

message CreateReviewReplyRequest {
  int64 review_id = 1;
  int64 target_user_id = 2;
  string body = 3;
}

message CreateReviewReplyResponse {
  ReviewReply reply = 1;
}

message UpdateReviewReplyRequest {
  int64 reply_id = 1;
  string body = 2;
}

message UpdateReviewReplyResponse {
  ReviewReply reply = 1;
}

message ListReviewsRequest {
  optional int64 target_user_id = 1;
  int32 page_size = 2;
  optional string page_token = 3;
}

message ListReviewsResponse {
  repeated Review items = 1;
  optional string next_page_token = 2;
}

message ListReviewRepliesRequest {
  int64 review_id = 1;
  int32 page_size = 2;
  optional string page_token = 3;
}

message ListReviewRepliesResponse {
  repeated ReviewReply items = 1;
  optional string next_page_token = 2;
}

message GetUserRatingRequest {
  int64 user_id = 1;
}

message GetUserRatingResponse {
  UserRating rating = 1;
}

message HasActiveVacancyForPvzRequest {
  int64 pvz_id = 1;
}

message HasActiveVacancyForPvzResponse {
  bool has_active_vacancy = 1;
}

message CheckResponseChatWritableRequest {
  int64 response_id = 1;
}

message CheckResponseChatWritableResponse {
  bool writable = 1;
  optional int64 assignment_id = 2;
  optional berusmenu.common.v1.AssignmentStatus assignment_status = 3;
}

service MatchingService {
  rpc CreateVacancy(CreateVacancyRequest) returns (CreateVacancyResponse);
  rpc GetVacancy(GetVacancyRequest) returns (GetVacancyResponse);
  rpc ListVacancies(ListVacanciesRequest) returns (ListVacanciesResponse);
  rpc ListOwnerVacancies(ListOwnerVacanciesRequest) returns (ListOwnerVacanciesResponse);
  rpc CreateResponse(CreateResponseRequest) returns (CreateResponseResponse);
  rpc WithdrawResponse(WithdrawResponseRequest) returns (WithdrawResponseResponse);
  rpc ListResponsesForVacancy(ListResponsesForVacancyRequest) returns (ListResponsesForVacancyResponse);
  rpc ListMyResponses(ListMyResponsesRequest) returns (ListMyResponsesResponse);
  rpc AcceptResponse(AcceptResponseRequest) returns (AcceptResponseResponse);
  rpc GetAssignment(GetAssignmentRequest) returns (GetAssignmentResponse);
  rpc ListMyAssignments(ListMyAssignmentsRequest) returns (ListMyAssignmentsResponse);
  rpc GetAssignmentForVacancy(GetAssignmentForVacancyRequest) returns (GetAssignmentForVacancyResponse);
  rpc CancelAssignment(CancelAssignmentRequest) returns (CancelAssignmentResponse);
  rpc CompleteAssignment(CompleteAssignmentRequest) returns (CompleteAssignmentResponse);
  rpc CreateReview(CreateReviewRequest) returns (CreateReviewResponse);
  rpc UpdateReview(UpdateReviewRequest) returns (UpdateReviewResponse);
  rpc CreateReviewReply(CreateReviewReplyRequest) returns (CreateReviewReplyResponse);
  rpc UpdateReviewReply(UpdateReviewReplyRequest) returns (UpdateReviewReplyResponse);
  rpc ListReviewReplies(ListReviewRepliesRequest) returns (ListReviewRepliesResponse);
  rpc ListReviews(ListReviewsRequest) returns (ListReviewsResponse);
  rpc GetUserRating(GetUserRatingRequest) returns (GetUserRatingResponse);
  rpc HasActiveVacancyForPvz(HasActiveVacancyForPvzRequest) returns (HasActiveVacancyForPvzResponse);
  rpc CheckResponseChatWritable(CheckResponseChatWritableRequest) returns (CheckResponseChatWritableResponse);
}
