services:
  postgres:
    image: postgres:17-alpine
    container_name: berusmenu-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-berusmenu}
      POSTGRES_USER: ${POSTGRES_USER:-berusmenu}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-berusmenu}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-berusmenu} -d ${POSTGRES_DB:-berusmenu}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - berusmenu

  redis:
    image: redis:7-alpine
    container_name: berusmenu-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - berusmenu

  kafka:
    image: redpandadata/redpanda:v25.1.2
    container_name: berusmenu-kafka
    restart: unless-stopped
    command:
      - redpanda
      - start
      - --overprovisioned
      - --smp
      - "1"
      - --memory
      - "512M"
      - --reserve-memory
      - "0M"
      - --node-id
      - "0"
      - --check=false
      - --kafka-addr
      - PLAINTEXT://0.0.0.0:9092
      - --advertise-kafka-addr
      - PLAINTEXT://kafka:9092
    ports:
      - "${KAFKA_PORT:-9092}:9092"
    volumes:
      - kafka_data:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy: true'"]
      interval: 15s
      timeout: 10s
      retries: 10
    networks:
      - berusmenu

  api-gateway:
    build:
      context: ..
      dockerfile: api-gateway/Dockerfile
    container_name: berusmenu-api-gateway
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-local}
      HTTP_ADDR: :8080
      AUTH_GRPC_ADDR: auth-service:50051
      INVENTORY_GRPC_ADDR: inventory-service:50052
      MATCHING_GRPC_ADDR: matching-service:50053
      COMMUNICATION_GRPC_ADDR: communication-service:50054
      REQUEST_TIMEOUT: ${REQUEST_TIMEOUT:-5s}
    depends_on:
      auth-service:
        condition: service_started
    ports:
      - "${API_GATEWAY_PORT:-8080}:8080"
    networks:
      - berusmenu

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: berusmenu-frontend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8080}
    depends_on:
      api-gateway:
        condition: service_started
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    networks:
      - berusmenu

  auth-service:
    build:
      context: ..
      dockerfile: auth-service/Dockerfile
    container_name: berusmenu-auth-service
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-local}
      GRPC_ADDR: :50051
      POSTGRES_DSN: postgres://${POSTGRES_USER:-berusmenu}:${POSTGRES_PASSWORD:-berusmenu}@postgres:5432/${POSTGRES_DB:-berusmenu}?sslmode=disable
      REDIS_ADDR: redis:6379
      KAFKA_BROKERS: kafka:9092
      JWT_SECRET: ${JWT_SECRET:-local-dev-secret-change-me}
      ACCESS_TOKEN_TTL: ${ACCESS_TOKEN_TTL:-15m}
      REFRESH_TOKEN_TTL: ${REFRESH_TOKEN_TTL:-720h}
      MIGRATIONS_DIR: internal/migrations
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    ports:
      - "${AUTH_GRPC_PORT:-50051}:50051"
    networks:
      - berusmenu

  inventory-service:
    profiles: ["future"]
    build:
      context: ../inventory-service
      dockerfile: Dockerfile
    container_name: berusmenu-inventory-service
    restart: unless-stopped
    networks:
      - berusmenu

  matching-service:
    profiles: ["future"]
    build:
      context: ../matching-service
      dockerfile: Dockerfile
    container_name: berusmenu-matching-service
    restart: unless-stopped
    networks:
      - berusmenu

  communication-service:
    profiles: ["future"]
    build:
      context: ../communication-service
      dockerfile: Dockerfile
    container_name: berusmenu-communication-service
    restart: unless-stopped
    networks:
      - berusmenu

  notification-service:
    build:
      context: ..
      dockerfile: notification-service/Dockerfile
    container_name: berusmenu-notification-service
    restart: unless-stopped
    environment:
      KAFKA_BROKERS: kafka:9092
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - berusmenu

volumes:
  postgres_data:
  redis_data:
  kafka_data:

networks:
  berusmenu:
    name: berusmenu
